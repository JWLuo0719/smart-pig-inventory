spring:
  application:
    name: pig-inventory-business-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/pig_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:pig_inventory}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/pig-inventory}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
    jwt-signing-secret: ${JWT_SIGNING_SECRET:}
    jwt-issuer: ${JWT_ISSUER:pig-inventory-business-api}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    bootstrap-admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
    bootstrap-organization-code: ${APP_BOOTSTRAP_ORGANIZATION_CODE:}
    bootstrap-organization-name: ${APP_BOOTSTRAP_ORGANIZATION_NAME:}
  object-storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:pig-inventory}
  inference:
    base-url: ${INFERENCE_BASE_URL:http://localhost:8100}
    provider: ${COUNTING_PROVIDER:unavailable}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

---
spring:
  config:
    activate:
      on-profile: dev
app:
  security:
    enabled: ${SECURITY_ENABLED:false}
