services:
  mysql:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  business-api:
    image: ${LAN_BUSINESS_IMAGE:?Set verified LAN_BUSINESS_IMAGE}
    restart: unless-stopped
  admin-web:
    restart: unless-stopped
  inference-api:
    restart: unless-stopped
  inference-worker:
    restart: unless-stopped
  gateway:
    restart: unless-stopped
  lan-https:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./infra/nginx/lan-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LAN_TLS_DIRECTORY:?Set LAN_TLS_DIRECTORY}:/etc/nginx/tls:ro
    depends_on:
      - gateway
