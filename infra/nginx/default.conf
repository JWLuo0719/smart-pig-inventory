server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # Docker service IPs change when a dependency is recreated. Resolve on request
    # so the gateway does not keep routing to a stopped container.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $business_api business-api;
    set $admin_web admin-web;

    # The admin browser calls the Next.js same-origin proxy. This location
    # must precede /api/ so /api/backend/* is not sent to Spring directly.
    location /api/backend/ {
        proxy_pass http://$admin_web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://$business_api:8080;
        proxy_set_header Host business-api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        proxy_pass http://$business_api:8080;
        proxy_set_header Host business-api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$admin_web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
