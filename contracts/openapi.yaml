openapi: 3.1.0
info:
  title: Smart Pig Inventory Business API
  version: 0.4.0
  description: >-
    路线 B+ 的业务合同基线。所有写操作接受 X-Idempotency-Key，所有时间使用 ISO 8601；
    离线采集必须完成 package/blob/manifest/commit 后才创建正式推理任务。ROI 使用完成
    EXIF 方向纠正后的图像坐标，并归一化到 0..1。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - {name: System}
  - {name: Identity}
  - {name: MasterData}
  - {name: Upload}
  - {name: Inventory}
  - {name: Review}
  - {name: InternalInference}
paths:
  /system/capabilities:
    get:
      tags: [System]
      security: []
      summary: 查询服务器可用能力及降级状态
      operationId: getCapabilities
      responses:
        '200':
          description: 能力快照
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiEnvelope'}
  /auth/login:
    post:
      tags: [Identity]
      security: []
      summary: 科研组账号登录
      operationId: login
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/refresh:
    post:
      tags: [Identity]
      security: []
      summary: 轮换访问令牌和刷新令牌
      operationId: refreshToken
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '200':
          description: 令牌轮换成功；旧刷新令牌立即失效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/logout:
    post:
      tags: [Identity]
      summary: 撤销当前刷新会话
      operationId: logout
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenRequest'}
      responses:
        '204': {description: 会话已撤销或此前已经撤销}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me:
    get:
      tags: [Identity]
      summary: 查询当前认证用户、激活组织和角色
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户上下文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /master-data/changes:
    get:
      tags: [MasterData]
      summary: 按同步游标增量拉取组织、栋舍和栏舍
      operationId: getMasterDataChanges
      parameters:
        - name: cursor
          in: query
          description: >-
            上次响应返回的全局单调 syncVersion；首次同步省略。非法或超过服务器当前水位的游标
            会返回 fullResyncRequired=true，客户端必须原子替换该组织缓存。
          schema: {type: string, pattern: '^[0-9]+$'}
      responses:
        '200':
          description: 增量主数据及新游标
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MasterDataChanges'}
  /upload-packages:
    post:
      tags: [Upload]
      summary: 创建或恢复离线采集包
      operationId: createUploadPackage
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUploadPackage'}
      responses:
        '200':
          description: 已存在采集包及服务器已有文件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPackage'}
        '201':
          description: 新建采集包
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPackage'}
        '409': {$ref: '#/components/responses/Conflict'}
  /upload-packages/{packageId}:
    get:
      tags: [Upload]
      summary: 查询上传包状态并恢复已完成 Blob
      operationId: getUploadPackage
      parameters:
        - {$ref: '#/components/parameters/PackageId'}
      responses:
        '200':
          description: 上传包当前状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPackage'}
        '404': {$ref: '#/components/responses/NotFound'}
  /upload-packages/{packageId}/blobs/{assetId}:
    put:
      tags: [Upload]
      summary: 幂等上传一张完整照片
      operationId: putUploadBlob
      parameters:
        - {$ref: '#/components/parameters/PackageId'}
        - {$ref: '#/components/parameters/AssetId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: X-Content-SHA256
          in: header
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {description: 文件已存在且校验一致}
        '201': {description: 文件保存并完成校验}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /upload-packages/{packageId}/manifest:
    put:
      tags: [Upload]
      summary: 验证采集清单
      operationId: putUploadManifest
      parameters:
        - {$ref: '#/components/parameters/PackageId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureManifest'}
      responses:
        '200': {description: 清单已存在且一致}
        '201': {description: 清单通过验证}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /upload-packages/{packageId}/commit:
    post:
      tags: [Upload]
      summary: 提交采集包并创建唯一盘点与推理任务
      operationId: commitUploadPackage
      parameters:
        - {$ref: '#/components/parameters/PackageId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200':
          description: 重放请求返回原任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommitResult'}
        '201':
          description: 首次提交成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommitResult'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /inventory-sessions/{sessionId}:
    get:
      tags: [Inventory]
      summary: 获取盘点状态、结果与告警
      operationId: getInventorySession
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
      responses:
        '200':
          description: 盘点详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventorySession'}
        '404': {$ref: '#/components/responses/NotFound'}
  /inventory-sessions/{sessionId}/confirm:
    post:
      tags: [Review]
      summary: 人工确认或修正盘点结果并锁定证据
      operationId: confirmInventorySession
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmInventory'}
      responses:
        '200':
          description: 已确认并记录审计
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventorySession'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /inference-jobs/{jobId}/result:
    put:
      tags: [InternalInference]
      summary: 推理服务幂等回传最终结果
      description: >-
        仅允许受信任的推理服务身份调用。相同任务和相同结果重复回传视为成功；
        相同任务回传不同最终结果返回 409。Spring 数据库是任务状态的唯一业务事实来源。
      operationId: putInferenceJobResult
      parameters:
        - {$ref: '#/components/parameters/JobId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InferenceJobResult'}
      responses:
        '200': {description: 结果已经以相同内容处理}
        '204': {description: 结果首次处理成功}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /media-assets/{assetId}/override-delete:
    post:
      tags: [Review]
      summary: 管理员带原因软删除媒体
      operationId: overrideDeleteMedia
      parameters:
        - {$ref: '#/components/parameters/AssetId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 8, maxLength: 500}
      responses:
        '200': {description: 已软删除并保留审计证据}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
    PackageId:
      name: packageId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: 未提供有效身份、凭据错误或访问令牌已经失效
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: 请求过于频繁
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: 状态冲突、幂等键冲突、媒体已锁定或重复图片
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: 数据或业务规则校验失败
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: 无权执行
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: 资源不存在或不属于当前组织
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    ApiEnvelope:
      type: object
      required: [data, correlationId, timestamp]
      properties:
        data: {type: object, additionalProperties: true}
        correlationId: {type: string}
        timestamp: {type: string, format: date-time}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 128}
        password: {type: string, minLength: 8, maxLength: 256, format: password}
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 32, maxLength: 2048}
    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, accessTokenExpiresAt, refreshTokenExpiresAt]
      properties:
        accessToken: {type: string, minLength: 1}
        refreshToken: {type: string, minLength: 32}
        tokenType: {type: string, const: Bearer}
        accessTokenExpiresAt: {type: string, format: date-time}
        refreshTokenExpiresAt: {type: string, format: date-time}
    CurrentUser:
      type: object
      required: [subjectId, displayName, activeOrganizationId, memberships]
      properties:
        subjectId: {type: string, minLength: 1, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 128}
        activeOrganizationId: {type: string, format: uuid}
        memberships:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/OrganizationMembership'}
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [organizationId, organizationCode, organizationName, roles]
      properties:
        organizationId: {type: string, format: uuid}
        organizationCode: {type: string, minLength: 1, maxLength: 64}
        organizationName: {type: string, minLength: 1, maxLength: 128}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [OPERATOR, REVIEWER, FARM_ADMIN, SYSTEM_ADMIN]}
    MasterDataChanges:
      type: object
      required: [cursor, fullResyncRequired, organizations, buildings, pens, deletedEntities]
      properties:
        cursor: {type: string}
        fullResyncRequired:
          type: boolean
          description: 为 true 时客户端必须在同一事务中以本响应替换当前组织的主数据缓存。
        organizations: {type: array, items: {$ref: '#/components/schemas/NamedEntity'}}
        buildings: {type: array, items: {$ref: '#/components/schemas/NamedEntity'}}
        pens: {type: array, items: {$ref: '#/components/schemas/NamedEntity'}}
        deletedEntities:
          type: array
          items: {$ref: '#/components/schemas/DeletedEntity'}
    DeletedEntity:
      type: object
      required: [entityType, id, syncVersion]
      properties:
        entityType: {type: string, enum: [organization, building, pen]}
        id: {type: string, format: uuid}
        syncVersion: {type: integer, format: int64, minimum: 0}
    NamedEntity:
      type: object
      required: [id, code, name, enabled, syncVersion]
      properties:
        id: {type: string, format: uuid}
        parentId: {type: [string, 'null'], format: uuid}
        code: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        erpExternalId: {type: [string, 'null']}
        syncVersion: {type: integer, format: int64}
    CreateUploadPackage:
      type: object
      required: [clientPackageId, organizationId, penId, businessDate, captureKind]
      properties:
        clientPackageId: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        penId: {type: string, format: uuid}
        businessDate: {type: string, format: date}
        captureKind: {type: string, enum: [single, left_center_right]}
    UploadPackage:
      type: object
      required: [id, clientPackageId, state, existingAssets]
      properties:
        id: {type: string, format: uuid}
        clientPackageId: {type: string, format: uuid}
        state: {type: string, enum: [awaiting_blobs, awaiting_manifest, ready_to_commit, committed]}
        existingAssets: {type: array, items: {type: string, format: uuid}}
    CaptureManifest:
      type: object
      required: [captureSetId, captureKind, penId, assets]
      properties:
        captureSetId: {type: string, format: uuid}
        captureKind: {type: string, enum: [single, left_center_right]}
        penId: {type: string, format: uuid}
        assets:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/ManifestAsset'}
    ManifestAsset:
      type: object
      additionalProperties: false
      required: [assetId, viewPosition, capturedAt, originalName, width, height, sha256, byteSize, mediaType, exif, roi]
      properties:
        assetId: {type: string, format: uuid}
        viewPosition: {type: string, enum: [single, left, center, right]}
        capturedAt:
          type: string
          format: date-time
          description: 客户端记录的采集时刻，必须包含时区偏移；服务端同时记录接收时间。
        originalName: {type: string, minLength: 1, maxLength: 255}
        width:
          type: integer
          minimum: 1
          description: 完成 EXIF 方向纠正后的像素宽度。
        height:
          type: integer
          minimum: 1
          description: 完成 EXIF 方向纠正后的像素高度。
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        perceptualHash: {type: [string, 'null']}
        byteSize: {type: integer, minimum: 1}
        mediaType: {type: string, enum: [image/jpeg, image/png, image/heic]}
        exif: {$ref: '#/components/schemas/SafeExif'}
        roi: {$ref: '#/components/schemas/Roi'}
    SafeExif:
      type: object
      additionalProperties: false
      description: 只允许业务需要且经过隐私筛选的 EXIF；不得上传 GPS、设备所有者或自由文本字段。
      properties:
        orientation: {type: [integer, 'null'], minimum: 1, maximum: 8}
        make: {type: [string, 'null'], maxLength: 128}
        model: {type: [string, 'null'], maxLength: 128}
        focalLengthMm: {type: [number, 'null'], exclusiveMinimum: 0}
        exposureTimeSeconds: {type: [number, 'null'], exclusiveMinimum: 0}
        iso: {type: [integer, 'null'], minimum: 0}
    Roi:
      type: [object, 'null']
      additionalProperties: false
      description: >-
        基于 EXIF 纠正后图像的归一化坐标。服务端必须额外验证 x + width <= 1
        且 y + height <= 1；null 表示整张图像。
      required: [x, y, width, height]
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        width: {type: number, exclusiveMinimum: 0, maximum: 1}
        height: {type: number, exclusiveMinimum: 0, maximum: 1}
    CommitResult:
      type: object
      required: [packageId, sessionId, inferenceJobId, status]
      properties:
        packageId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        inferenceJobId: {type: string, format: uuid}
        status: {type: string, enum: [submitted, processing, review_required]}
    InventorySession:
      type: object
      required: [id, penId, businessDate, status]
      properties:
        id: {type: string, format: uuid}
        penId: {type: string, format: uuid}
        businessDate: {type: string, format: date}
        status: {type: string, enum: [draft, submitted, processing, review_required, confirmed]}
        count: {type: [integer, 'null'], minimum: 0}
        rawModelCount: {type: [integer, 'null'], minimum: 0}
        inferenceSource: {type: [string, 'null'], enum: [server, device, manual, null]}
        model: {$ref: '#/components/schemas/ModelIdentity'}
        warnings: {type: array, items: {type: string}}
    ModelIdentity:
      type: [object, 'null']
      required: [modelKey, version, checksum, adapterVersion]
      properties:
        modelKey: {type: string}
        version: {type: string}
        checksum: {type: string}
        adapterVersion: {type: string}
    ConfirmInventory:
      type: object
      required: [confirmedCount]
      properties:
        confirmedCount: {type: integer, minimum: 0}
        reason: {type: [string, 'null'], minLength: 8, maxLength: 500}
    InferenceJobResult:
      type: object
      additionalProperties: false
      required: [status, count, detections, warnings, modelKey, modelVersion, modelChecksum, adapterVersion, inferenceSource, latencyMs]
      properties:
        status: {type: string, enum: [succeeded, review_required, failed]}
        count: {type: [integer, 'null'], minimum: 0}
        detections:
          type: array
          items: {$ref: '#/components/schemas/Detection'}
        warnings: {type: array, items: {type: string, maxLength: 500}}
        modelKey: {type: string, minLength: 1}
        modelVersion: {type: string, minLength: 1}
        modelChecksum: {type: string, minLength: 1}
        adapterVersion: {type: string, minLength: 1}
        inferenceSource: {type: string, minLength: 1}
        latencyMs: {type: integer, minimum: 0}
        failureCode: {type: [string, 'null'], maxLength: 128}
        failureMessage: {type: [string, 'null'], maxLength: 1000}
    Detection:
      type: object
      additionalProperties: false
      required: [assetId, bbox, confidence, classId]
      properties:
        assetId: {type: string, format: uuid}
        bbox:
          type: array
          prefixItems:
            - {type: number}
            - {type: number}
            - {type: number}
            - {type: number}
          minItems: 4
          maxItems: 4
        confidence: {type: number, minimum: 0, maximum: 1}
        classId: {type: integer}
    Problem:
      type: object
      required: [type, title, status, correlationId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        correlationId: {type: string}
