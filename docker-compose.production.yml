# Apply after docker-compose.yml. TLS terminates at the host reverse proxy.
# No infrastructure port is published. Use a new production project/volumes.
services:
  mysql:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  inference-api:
    image: ${RELEASE_INFERENCE_IMAGE:?set a verified immutable inference image}
    build: !reset null
    restart: unless-stopped
  inference-worker:
    image: ${RELEASE_INFERENCE_IMAGE:?set a verified immutable inference image}
    build: !reset null
    restart: unless-stopped
  business-api:
    image: ${RELEASE_BUSINESS_IMAGE:?set a verified immutable business image}
    build: !reset null
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SECURITY_ENABLED: 'true'
      APP_E2E_FIXTURES_ENABLED: 'false'
      APP_E2E_FIXTURE_PASSWORD: ''
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:?set the production HTTPS origin}
      INFERENCE_DISPATCHER_ENABLED: 'true'
      MULTIVIEW_AUTO_COUNT_ENABLED: 'false'
  admin-web:
    image: ${RELEASE_ADMIN_IMAGE:?set a verified immutable admin image}
    build: !reset null
    restart: unless-stopped
  gateway:
    ports: !override
      - '127.0.0.1:8088:80'
    restart: unless-stopped
