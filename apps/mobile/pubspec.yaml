name: smart_pig_inventory
description: Offline-first mobile client for smart pig farm inventory.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  dio: ^5.8.0+1
  crypto: ^3.0.6
  uuid: ^4.5.1
  image_picker: ^1.1.2
  workmanager: ^0.7.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.24.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/smart-pig-farm-owner-logo-v1.png
